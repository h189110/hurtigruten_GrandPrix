name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and image owner
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="dev-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push combined image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/Dockerfile.combined
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/hurtigrute-grand-prix:${{ steps.meta.outputs.version }}
            ${{ github.ref_type == 'tag' && format('ghcr.io/{0}/hurtigrute-grand-prix:latest', steps.meta.outputs.owner) || '' }}

      - name: Build release compose file pinned to this version
        if: github.ref_type == 'tag'
        run: |
          mkdir -p dist
          sed -e "s|\${GHCR_OWNER:-hurtigrute-grand-prix}|${{ steps.meta.outputs.owner }}|g" \
              -e "s|\${VERSION:-latest}|${GITHUB_REF_NAME}|g" \
              infrastructure/docker-compose.release.yml > dist/docker-compose.yml
          grep -n 'image:' dist/docker-compose.yml
        shell: bash

      - name: Attach release compose file
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/docker-compose.yml \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/docker-compose.yml --clobber
        shell: bash
